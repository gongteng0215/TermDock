name: Packaged Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  smoke:
    name: Packaged Smoke ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-14
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unpacked package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run pack

      - name: Run packaged smoke
        run: pnpm run smoke:ui:packaged

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-${{ matrix.platform }}
          path: artifacts/smoke/**
          if-no-files-found: error

