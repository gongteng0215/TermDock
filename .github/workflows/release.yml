name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0 or v0.1.0-test.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  meta:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - name: Resolve tag and release type
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi

          if [[ "$TAG_NAME" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac-x64
            script: dist:mac:x64
            verify_platform: mac
          - os: macos-14
            platform: mac-arm64
            script: dist:mac:arm64
            verify_platform: mac
          - os: windows-2022
            platform: win
            script: dist:win
            verify_platform: win

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.meta.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release secrets
        env:
          APPLE_API_KEY_B64: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_API_KEY_B64 || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_API_KEY_ID || '' }}
        run: pnpm run release:prepare-secrets -- --platform=${{ matrix.verify_platform }}

      - name: Resolve release verification mode
        id: verify_mode
        shell: bash
        env:
          VERIFY_PLATFORM: ${{ matrix.verify_platform }}
          HAS_MAC_CERT: ${{ startsWith(matrix.platform, 'mac') && secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' || false }}
          HAS_MAC_NOTARY: ${{ startsWith(matrix.platform, 'mac') && ((secrets.APPLE_API_KEY_B64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '') || (secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '') || (secrets.APPLE_KEYCHAIN != '' && secrets.APPLE_KEYCHAIN_PROFILE != '')) || false }}
          HAS_WIN_CERT: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' || false }}
        run: |
          PREFLIGHT_ARGS="--platform=$VERIFY_PLATFORM"
          VERIFY_ARGS="--platform=$VERIFY_PLATFORM"

          if [ "$VERIFY_PLATFORM" = "mac" ]; then
            VERIFY_ARGS="$VERIFY_ARGS --install-smoke"
            if [ "$HAS_MAC_CERT" = "true" ] && [ "$HAS_MAC_NOTARY" = "true" ]; then
              PREFLIGHT_ARGS="$PREFLIGHT_ARGS --require-signing --require-notarization"
              VERIFY_ARGS="$VERIFY_ARGS --expect-signed --expect-notarized"
            fi
          else
            VERIFY_ARGS="$VERIFY_ARGS --install-smoke"
            if [ "$HAS_WIN_CERT" = "true" ]; then
              PREFLIGHT_ARGS="$PREFLIGHT_ARGS --require-signing"
              VERIFY_ARGS="$VERIFY_ARGS --expect-signed"
            fi
          fi

          echo "preflight_args=$PREFLIGHT_ARGS" >> "$GITHUB_OUTPUT"
          echo "verify_args=$VERIFY_ARGS" >> "$GITHUB_OUTPUT"

      - name: Release signing preflight
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ startsWith(matrix.platform, 'mac') && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.platform, 'mac') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_KEYCHAIN: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_KEYCHAIN || '' }}
          APPLE_KEYCHAIN_PROFILE: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_KEYCHAIN_PROFILE || '' }}
        run: pnpm run release:preflight -- ${{ steps.verify_mode.outputs.preflight_args }}

      - name: Build package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MAC_CSC_LINK_VALUE: ${{ startsWith(matrix.platform, 'mac') && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD_VALUE: ${{ startsWith(matrix.platform, 'mac') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK_VALUE: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD_VALUE: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_VALUE: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID_VALUE: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_VALUE: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID_VALUE: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD_VALUE: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID_VALUE: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_KEYCHAIN_VALUE: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_KEYCHAIN || '' }}
          APPLE_KEYCHAIN_PROFILE_VALUE: ${{ startsWith(matrix.platform, 'mac') && secrets.APPLE_KEYCHAIN_PROFILE || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${MAC_CSC_LINK_VALUE}" ]; then
            export CSC_LINK="${MAC_CSC_LINK_VALUE}"
          fi
          if [ -n "${MAC_CSC_KEY_PASSWORD_VALUE}" ]; then
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD_VALUE}"
          fi
          if [ -n "${WIN_CSC_LINK_VALUE}" ]; then
            export WIN_CSC_LINK="${WIN_CSC_LINK_VALUE}"
          fi
          if [ -n "${WIN_CSC_KEY_PASSWORD_VALUE}" ]; then
            export WIN_CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD_VALUE}"
          fi
          if [ -n "${APPLE_API_KEY_VALUE}" ]; then
            export APPLE_API_KEY="${APPLE_API_KEY_VALUE}"
          fi
          if [ -n "${APPLE_API_KEY_ID_VALUE}" ]; then
            export APPLE_API_KEY_ID="${APPLE_API_KEY_ID_VALUE}"
          fi
          if [ -n "${APPLE_API_ISSUER_VALUE}" ]; then
            export APPLE_API_ISSUER="${APPLE_API_ISSUER_VALUE}"
          fi
          if [ -n "${APPLE_ID_VALUE}" ]; then
            export APPLE_ID="${APPLE_ID_VALUE}"
          fi
          if [ -n "${APPLE_APP_SPECIFIC_PASSWORD_VALUE}" ]; then
            export APPLE_APP_SPECIFIC_PASSWORD="${APPLE_APP_SPECIFIC_PASSWORD_VALUE}"
          fi
          if [ -n "${APPLE_TEAM_ID_VALUE}" ]; then
            export APPLE_TEAM_ID="${APPLE_TEAM_ID_VALUE}"
          fi
          if [ -n "${APPLE_KEYCHAIN_VALUE}" ]; then
            export APPLE_KEYCHAIN="${APPLE_KEYCHAIN_VALUE}"
          fi
          if [ -n "${APPLE_KEYCHAIN_PROFILE_VALUE}" ]; then
            export APPLE_KEYCHAIN_PROFILE="${APPLE_KEYCHAIN_PROFILE_VALUE}"
          fi

          pnpm run ${{ matrix.script }}

      - name: Verify signed artifacts
        run: pnpm run release:verify -- ${{ steps.verify_mode.outputs.verify_args }}

      - name: Upload release verification report
        uses: actions/upload-artifact@v7
        with:
          name: release-verify-${{ matrix.platform }}
          path: artifacts/release-verify/**
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag_name }}
          name: TermDock ${{ needs.meta.outputs.tag_name }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.blockmap
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
