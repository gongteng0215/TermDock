name: Bug report
description: Report a reproducible TermDock problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove real hosts, usernames, passwords, private keys, and production paths before posting.
  - type: input
    id: version
    attributes:
      label: TermDock version
      description: Use the release version or commit hash if running from source.
      placeholder: "v0.1.24"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SSH terminal
        - SFTP transfer
        - Session management
        - Dangerous-command guardrails
        - Retry Center
        - Operation Center
        - Server health
        - Port forwarding
        - Settings
        - Diagnostics/logs
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. Run...
        4. See...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Attach screenshots, sanitized logs, or a sanitized bug report export if useful.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real credentials, private keys, tokens, and sensitive server details.
          required: true
